name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Java 25
        uses: actions/setup-java@v7
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - name: Run tests
        run: ./mvnw clean test
